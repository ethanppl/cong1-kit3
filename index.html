<html lang="zh-Hant">

  <title>繁體中文倉頡練習</title>

  <script defer data-domain="cong1kit3.ethanppl.com" src="https://plausible.ethanppl.com/js/script.js"></script>
  <script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>

    body {
      margin: 0px;
    }

<body>
  <div id="myapp"></div>
  <script type="text/javascript">
    var app = Elm.Main.init({
      node: document.getElementById('myapp')
    });

    // Subscribe to the Elm port and call the JavaScript function
    app.ports.sendPlausibleEvent.subscribe(function(data) {
      // Call the global JavaScript function with data from Elm
      plausible(data);
    });
  </script>
</body>
